<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isometric Drawing – Step by Step</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--line:#222;--new:#e8590c;--dim:#1c7ed6;--ghost:#aaa;--card:#fff;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#eee;--line:#eee;--new:#ff922b;--dim:#4dabf7;--ghost:#666;--card:#222;--bd:#444}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#eee;--line:#eee;--new:#ff922b;--dim:#4dabf7;--ghost:#666;--card:#222;--bd:#444}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:12px;max-width:640px}
h1{font-size:18px;margin:4px 0}
svg{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:10px 0}
.box b{color:var(--new)}
.nav{display:flex;gap:8px}
button{flex:1;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.on{background:var(--dim);color:#fff;border-color:var(--dim)}
#m{margin:8px 0}
button.p{background:var(--new);color:#fff;border-color:var(--new)}
ul{margin:6px 0 0;padding-left:18px}
</style></head><body>
<div class="nav" id="m"><button id="ma">📐 Angles</button><button id="ml">📏 Lengths</button></div>
<svg id="s" viewBox="60 30 1000 960"></svg>
<div class="box" id="t"></div>
<div class="nav"><button id="b">◀ Back</button><button class="p" id="n">Next ▶</button></div>
<script>
// Real 3D coords in cm: x = along 8 cm edge (down-right), y = depth 6 cm (up-right), z = height. 1 cm = 50px along axes, 58px vertical.
const Q={1:[0,0,7],2:[2,0,7],3:[3,0,7],4:[5,0,7],5:[0,6,7],6:[2,6,7],7:[6,3,7],8:[6,6,7],9:[8,6,7],10:[8,3,7],11:[6,6,3],12:[4,6,3],13:[4,6,2],14:[4,0,3],15:[6,0,3],16:[4,0,2],17:[2,0,2],18:[2,6,2],19:[0,0,0],20:[0,6,0],21:[8,0,0],22:[8,6,0],23:[8,0,3],A:[8,0,7],B:[6,3,3]};
const P={};for(const k in Q){const[x,y,z]=Q[k];P[k]=[235+50*x+50*y,680+29*x-29*y-58*z]}
// M = where line 14->12 passes behind the sloped edge 7-15 (found by intersection)
(function(){const a=P[14],b=P[12],c=P[7],d=P[15];const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]];
const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/(r[0]*s[1]-r[1]*s[0]);P.M=[a[0]+t*r[0],a[1]+t*r[1]]})();
const S=[
{t:"Step 1 – Light box frame",
 d:["Draw a vertical line and two lines at <b>30°</b>: one down-right, one up-right.","From 19 measure <b>8 cm</b> down-right to 21, then <b>6 cm</b> up-right to 22 (and 20).","Raise <b>7 cm</b> verticals and finish the box with very light lines."],
 e:[[19,21,'g'],[21,22,'g'],[22,20,'g'],[20,19,'g'],[19,1,'g'],[21,'A','g'],[22,9,'g'],[20,5,'g'],[1,'A','g'],['A',9,'g'],[9,5,'g'],[5,1,'g']],
 L:[[19,21,"8 cm",-75,43],[21,22,"6 cm",60,35],[19,1,"7 cm",-65,0],[1,5,"6 cm",-60,-35]]},
{t:"Step 2 – Front edge of the left wall",
 d:["Darken 19–1 (7 cm) and the base 19–21.","On the top front edge from 1 mark <b>2 cm</b> (point 2) and a further <b>1 cm</b> (point 3). Draw 1–3.","From 2 draw straight down <b>5 cm</b> to 17 (17 is 2 cm above the base)."],
 e:[[19,1],[19,21],[1,2],[2,3],[2,17]],
 L:[[1,2,"2 cm",0,-45],[2,3,"1 cm",40,-23],[2,17,"5 cm",-60,0]]},
{t:"Step 3 – Front steps of the bottom",
 d:["From 17 draw <b>2 cm</b> along the 30° down-right line to 16.","From 16 go up <b>1 cm</b> to 14.","From 14 draw <b>2 cm</b> to 15, then <b>2 cm</b> more to 23.","From 23 drop <b>3 cm</b> to 21."],
 e:[[17,16],[16,14],[14,15],[15,23],[23,21]],
 L:[[17,16,"2 cm",0,50],[16,14,"1 cm",-120,0],[14,15,"2 cm",0,-45],[15,23,"2 cm",0,-45],[23,21,"3 cm",45,0]]},
{t:"Step 4 – Slanted slab on top",
 d:["From 3 mark <b>2 cm</b> along the front top line to 4.","At the back: from 5 draw 5–6 = <b>2 cm</b>, parallel to 3–4.","Join 3–5 and 4–6. Check: 3–4 makes <b>30°</b> and 4–6 makes <b>60°</b> with the horizontal.","Drop 6 down to 18 and join 17–18 along the 30° up-right line."],
 e:[[3,4],[3,5],[4,6],[5,6],[6,18],[17,18]],
 L:[[3,4,"2 cm",0,50],[5,6,"2 cm",0,-45]]},
{t:"Step 5 – Top of the right block",
 d:["From 22 draw up to 9 (<b>7 cm</b>) and join 21–22.","At the top: 9–8 = <b>2 cm</b>, drawn toward the left along the 30° line.","From 9 and 8 draw 9–10 and 8–7, each <b>3 cm</b> toward you. Join 7–10."],
 e:[[21,22],[22,9],[9,8],[8,7],[9,10],[7,10]],
 L:[[9,8,"2 cm",0,-45],[8,7,"3 cm",0,-45],[9,10,"3 cm",0,45]]},
{t:"Step 6 – Sloping faces and ledge line",
 d:["Mark B: 4 cm straight below 7 (same height as 15), then 3 cm from B toward you reaches 15.","Join <b>7 → 15</b> (drops 4 cm over 3 cm), then draw <b>10 → 23</b> parallel to it.","From 14 draw the ledge edge up-right (30°). Its full length is 6 cm (to 12) but only the part up to line 7–15 is visible."],
 e:[[7,'B','h'],['B',15,'h'],[7,15],[10,23],[14,'M']],
 L:[],T:[[7,'B',"4 cm"],['B',15,"3 cm"],[14,12,"6 cm"]]},
{t:"Step 7 – Hidden lines (dashed) & finish",
 d:["Thin <b>dashed</b> lines, drawn lightly:","<b>20–22</b> = 8 cm, <b>5–20</b> = 7 cm (down from 5), <b>8–11</b> = 4 cm (down from 8).","<b>11–12</b> = 2 cm, <b>12–13</b> = 1 cm, <b>13–16</b> = 6 cm (also 11–15 = 6 cm, 13–18 = 2 cm, M–12 = rest of 14–12).","Darken the outlines and write <b>ISOMETRIC</b>."],
 e:[[20,22,'d'],[5,20,'d'],[8,11,'d'],[11,12,'d'],[12,13,'d'],[13,18,'d'],[13,16,'d'],[11,15,'d'],['M',12,'d'],[19,17,'d']],
 L:[],T:[[20,22,"8 cm"],[5,20,"7 cm"],[8,11,"4 cm"],[11,12,"2 cm"],[12,13,"1 cm"],[13,16,"6 cm"],[11,15,"6 cm"]]}
];
let i=0;const svg=document.getElementById('s');
const col={d:'var(--dim)',n:'var(--new)',l:'var(--line)',g:'var(--ghost)',f:'var(--fg)'};
function ln(x1,y1,x2,y2,c,w,dash){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c};stroke-width:${w}" ${dash?'stroke-dasharray="8 6"':''} stroke-linecap="round"/>`}
function arrow(x,y,dx,dy,c){const l=Math.hypot(dx,dy);dx/=l;dy/=l;const px=-dy,py=dx;
 return `<polygon points="${x},${y} ${x-dx*14+px*5},${y-dy*14+py*5} ${x-dx*14-px*5},${y-dy*14-py*5}" style="fill:${c}"/>`}
function dim(a,b,t,ox,oy){const A=P[a],B=P[b];const a2=[A[0]+ox,A[1]+oy],b2=[B[0]+ox,B[1]+oy];
 const k=0.88,e1=[A[0]+ox*k,A[1]+oy*k],e2=[B[0]+ox*k,B[1]+oy*k];
 let h=ln(A[0],A[1],e1[0],e1[1],col.d,1.5)+ln(B[0],B[1],e2[0],e2[1],col.d,1.5)+ln(a2[0],a2[1],b2[0],b2[1],col.d,2);
 h+=arrow(a2[0],a2[1],a2[0]-b2[0],a2[1]-b2[1],col.d)+arrow(b2[0],b2[1],b2[0]-a2[0],b2[1]-a2[1],col.d);
 const mx=(a2[0]+b2[0])/2,my=(a2[1]+b2[1])/2;
 return h+`<rect x="${mx-35}" y="${my-16}" width="70" height="28" rx="4" style="fill:var(--card);stroke:${col.d};stroke-width:1.5"/><text x="${mx}" y="${my+6}" font-size="20" font-weight="700" text-anchor="middle" style="fill:${col.d}">${t}</text>`}
const EX=[[],[],[],[[3,4,0],[4,6,0]],[],[],[]];
function so(p,q,r){return (q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0])}
function segInt(a,b,c,d){return so(a,b,c)*so(a,b,d)<0&&so(c,d,a)*so(c,d,b)<0}
function hitSeg(bx,p,q){const[x0,y0,x1,y1]=bx;if(p[0]>x0&&p[0]<x1&&p[1]>y0&&p[1]<y1)return true;if(q[0]>x0&&q[0]<x1&&q[1]>y0&&q[1]<y1)return true;
 const c=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];for(let k=0;k<4;k++)if(segInt(p,q,c[k],c[(k+1)%4]))return true;return false}
function hitBox(a,b){return !(a[2]<b[0]||b[2]<a[0]||a[3]<b[1]||b[3]<a[1])}
function pick(cands,segs,boxes){let best=cands[0],bs=1e9;cands.forEach((c,idx)=>{let sc=idx*0.01;
 segs.forEach(g=>{if(hitSeg(c.bx,g[0],g[1]))sc+=5});boxes.forEach(b=>{if(hitBox(c.bx,b))sc+=5});if(sc<bs){bs=sc;best=c}});return best}
let mode='len';const D=Math.PI/180,R=34;
function norm(x){x%=360;return x<0?x+360:x}
function draw(){let h='',txt='';const segs=[],boxes=[],used={},all=[];
 for(let k=0;k<=i;k++)S[k].e.forEach(([a,b,m])=>{
  const cur=k===i,A=P[a],B=P[b];if(cur)used[a]=used[b]=1;
  if(m!=='h')all.push([a,b,m==='g']);
  if(m==='h'){if(cur){h+=ln(A[0],A[1],B[0],B[1],col.d,2.5,1);segs.push([A,B])}return}
  if(m==='g'){if(i===0){h+=ln(A[0],A[1],B[0],B[1],col.g,1.5,1);segs.push([A,B])}return}
  segs.push([A,B]);h+=ln(A[0],A[1],B[0],B[1],cur?col.n:(m==='d'?col.g:col.l),cur?5:2.2,m==='d')});
 const arc=(V,ref,df,txtOnly)=>{const val=Math.round(Math.abs(df)/5)*5,mid=ref+df/2,pt=(r,an)=>[V[0]+r*Math.cos(an*D),V[1]+r*Math.sin(an*D)];
  const a0=pt(R,ref),a1=pt(R,ref+df);
  h+=`<path d="M${a0[0]},${a0[1]} A${R},${R} 0 0 ${df>0?1:0} ${a1[0]},${a1[1]}" style="fill:none;stroke:${col.d};stroke-width:2.5"/>`;
  const cs=[];[R+22,R+40,R+58].forEach(r=>{const c=pt(r,mid);cs.push({c,bx:[c[0]-26,c[1]-15,c[0]+26,c[1]+11]})});
  const ch=pick(cs,segs,boxes);boxes.push(ch.bx);
  h+=`<text x="${ch.c[0]}" y="${ch.c[1]+7}" font-size="20" font-weight="700" text-anchor="middle" style="fill:${col.d}">${val}°</text>`;return val};
 if(mode==='len'){
  S[i].L.forEach(([a,b,t,ox,oy])=>{h+=dim(a,b,t,ox,oy);const A=P[a],B=P[b];
   segs.push([[A[0]+ox,A[1]+oy],[B[0]+ox,B[1]+oy]],[A,[A[0]+ox,A[1]+oy]],[B,[B[0]+ox,B[1]+oy]]);
   const mx=(A[0]+B[0])/2+ox,my=(A[1]+B[1])/2+oy;boxes.push([mx-35,my-16,mx+35,my+12])});
  (S[i].T||[]).forEach(([a,b,t])=>{const A=P[a],B=P[b],own=segs.filter(g=>!(g[0]===A&&g[1]===B)),cs=[];
   [.5,.4,.6,.3,.7,.2,.8].forEach(f=>{const c=[A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f];cs.push({c,bx:[c[0]-33,c[1]-15,c[0]+33,c[1]+13]})});
   const ch=pick(cs,own,boxes);boxes.push(ch.bx);
   h+=`<rect x="${ch.c[0]-33}" y="${ch.c[1]-15}" width="66" height="28" rx="5" style="fill:var(--card);stroke:${col.d};stroke-width:2"/><text x="${ch.c[0]}" y="${ch.c[1]+6}" font-size="20" font-weight="700" text-anchor="middle" style="fill:${col.d}">${t}</text>`});
  txt=S[i].d.map(x=>'<li>'+x+'</li>').join('');
 }else{
  let es=S[i].e.filter(e=>e[2]!=='g');if(i===0)es=[[19,21],[19,20],[19,1],[21,22]];if(i===6)es=[[20,22],[16,13],[5,20]];
  const seen={},lines=[];
  es.forEach(([p,q])=>{const V=P[p],O=P[q];const th=norm(Math.atan2(O[1]-V[1],O[0]-V[0])/D);let a=th%180;if(a>90)a=180-a;const val=Math.round(a/5)*5;
   lines.push(p+'–'+q+': <b>'+val+'°</b>');
   const ref=(th<90||th>270)?0:180;let df=th-ref;if(df>180)df-=360;if(df<-180)df+=360;
   const pt=(r,an)=>[V[0]+r*Math.cos(an*D),V[1]+r*Math.sin(an*D)],r0=pt(75,ref),a0=pt(R+8,ref),a1=pt(R+8,ref+df);
   h+=ln(V[0],V[1],r0[0],r0[1],col.d,1.5,1)+`<path d="M${a0[0]},${a0[1]} A${R+8},${R+8} 0 0 ${df>0?1:0} ${a1[0]},${a1[1]}" style="fill:none;stroke:${col.d};stroke-width:3"/>`;
   segs.push([V,r0]);
   const cs=[];[R+34,R+52,R+70].forEach(r=>{const c=pt(r,ref+df/2);cs.push({c,bx:[c[0]-26,c[1]-15,c[0]+26,c[1]+11]})});
   const ch=pick(cs,segs,boxes);boxes.push(ch.bx);
   h+=`<text x="${ch.c[0]}" y="${ch.c[1]+7}" font-size="22" font-weight="700" text-anchor="middle" style="fill:${col.d}">${val}°</text>`});
  const info=[];
  Object.keys(used).forEach(v=>{if(v==='M'||v==='A'||v==='B')return;const V=P[v];
   const th=[...new Set(all.filter(e=>(i===0||!e[2])&&(e[0]==v||e[1]==v)).map(e=>{const o=P[e[0]==v?e[1]:e[0]];return norm(Math.atan2(o[1]-V[1],o[0]-V[0])/D)}))].sort((x,y)=>x-y);
   const vals=[];if(th.length>1)th.forEach((t,k)=>{const g=norm(th[(k+1)%th.length]-t);if(g>0.5&&g<179)vals.push(Math.round(g/5)*5)});
   if(vals.length)info.push('<b>'+v+'</b>: '+vals.join('°, ')+'°')});
  txt='';
 }
 Object.keys(used).forEach(n=>{if(!P[n]||n==='M'||n==='A'||n==='B')return;const V=P[n],cs=[];
  [[225,26],[270,24],[180,26],[315,26],[135,26],[0,26],[90,24],[45,26],[225,40],[270,38],[180,40],[315,40],[135,40],[0,40],[90,38],[45,40]].forEach(([an,r])=>{const c=[V[0]+r*Math.cos(an*D),V[1]+r*Math.sin(an*D)];cs.push({c,bx:[c[0]-13,c[1]-14,c[0]+13,c[1]+12]})});
  const ch=pick(cs,segs,boxes);boxes.push(ch.bx);
  h+=`<text x="${ch.c[0]}" y="${ch.c[1]+8}" font-size="26" font-weight="700" text-anchor="middle" style="fill:${col.n}">${n}</text>`});
 if(i===S.length-1)h+=`<text x="640" y="965" font-size="30" font-weight="700" text-anchor="middle" style="fill:${col.f}">ISOMETRIC</text>`;
 svg.innerHTML=h;
 const tb=document.getElementById('t');tb.style.display='none';tb.innerHTML=`<b>${S[i].t}</b> (${i+1}/${S.length})${txt?'<ul>'+txt+'</ul>':''}`;
 ma.className=mode==='ang'?'on':'';ml.className=mode==='len'?'on':'';
 b.disabled=i==0;n.disabled=i==S.length-1}
const b=document.getElementById('b'),n=document.getElementById('n'),ma=document.getElementById('ma'),ml=document.getElementById('ml');
n.onclick=()=>{i++;draw()};b.onclick=()=>{i--;draw()};ma.onclick=()=>{mode='ang';draw()};ml.onclick=()=>{mode='len';draw()};draw();
</script></body></html>
